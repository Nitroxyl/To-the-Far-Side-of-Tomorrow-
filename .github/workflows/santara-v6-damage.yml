name: Santara V6 damage regression
on:
  push:
    paths:
      - 'santara-damage-core.js'
      - 'santara-calculator-megas.js'
      - 'pokemon-mega-stones.js'
      - 'pokemon-mega-assignments.js'
      - 'tests/santara-mega-preview.test.mjs'
      - 'santara-player-unlocks.js'
      - 'tests/santara-trainer-unlocks.test.mjs'
      - 'santara-damage-rules.js'
      - 'tests/santara-custom-mechanics.test.mjs'
      - 'santara-damage-calculator.js'
      - 'santara-spoiler-gates.js'
      - 'pokemon-party.js'
      - 'tests/santara-player-release.test.mjs'
      - 'SANTARA_COMBAT_V53.md'
      - 'combat-guide.html'
      - 'pokemon-v6-hp-migration.js'
      - 'pokemon-party.html'
      - 'tests/santara-spoiler-gates.test.mjs'
      - 'pokemon-math.js'
      - 'tests/santara-damage-core.test.mjs'
      - 'tests/santara-browser-bundles.test.mjs'
      - 'tests/santara-damage-layout.test.mjs'
      - 'damage-calculator.html'
      - '.github/workflows/santara-v6-damage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official calculator package
        run: npm install --no-save --no-package-lock @smogon/calc@0.12.0 jsdom@26.1.0
      - name: Run damage adapter tests
        run: node --test tests/santara-mega-preview.test.mjs tests/santara-player-release.test.mjs tests/santara-trainer-unlocks.test.mjs tests/santara-custom-mechanics.test.mjs tests/santara-damage-core.test.mjs tests/santara-browser-bundles.test.mjs tests/santara-damage-layout.test.mjs tests/santara-spoiler-gates.test.mjs
