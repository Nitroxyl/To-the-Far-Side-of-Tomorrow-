width:150px}.btn{border:1px solid #45616a;background:#1a3440;color:var(--text);padding:10px 14px;border-radius:9px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center}.btn:hover{border-color:#68c7b5}.btn.primary{background:#3eb79f;color:#06231e;border-color:#3eb79f}.btn.primary:hover{background:#63d0b9}.btn.ghost{background:transparent;border-color:var(--edge)}.btn.warn{border-color:#6d4448;color:#ffb3b3}.btn.small{font-size:12px;padding:7px 11px}.collection{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.entry{background:linear-gradient(160deg,#192837,#14202d);border:1px solid #314457;border-radius:14px;padding:17px 18px;min-width:0;display:flex;flex-direction:column;gap:9px}.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.entry h3{margin:5px 0 0;font-size:18px;line-height:1.25}.entry .id{color:#7793a4;font-size:11px;font-weight:800;letter-spacing:1px}.meta{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-flex;padding:4px 8px;border-radius:100px;background:#263748;color:#bbcad6;font-size:11px;font-weight:700;border:1px solid #34485a}.pill.green{color:#9cebd0;border-color:#377963;background:#193a36}.pill.gold{color:#ffdb96;border-color:#7d6543;background:#3b3025}.pill.red{color:#ffc1bd;border-color:#855054;background:#422c31}.entry .detail{font-size:13px;color:#b8cad5;line-height:1.6;overflow-wrap:anywhere;min-height:42px}.entry .footer{margin-top:auto;display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #2c3c4e;padding-top:11px}.entry .footer small{color:#829bad;font-size:11px}.empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--muted);border:1px dashed #40505d;border-radius:14px}.alert{padding:12px 15px;background:#223d39;border:1px solid #4c7d70;border-radius:11px;color:#c4f4dd;margin:0 0 18px}.guide{margin:0;padding-left:23px;color:var(--muted)}.guide li{margin-bottom:11px}.tiny{font-size:12px;color:var(--muted)}.smallcaps{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:1px;text-transform:uppercase}.inlinehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}.inlinehead h2{font-size:19px;margin:0}.footerbar{margin-top:28px;color:#748c9b;font-size:12px}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:10}.modal{max-width:720px;width:100%;max-height:min(85vh,820px);display:flex;flex-direction:column;background:#111e2c;border:1px solid #50717e;border-radius:18px;box-shadow:0 32px 90px #0009}.modalheader{display:flex;justify-content:space-between;align-items:center;padding:20px 23px;border-bottom:1px solid #354759}.modalheader h2{margin:0;font-size:22px}.modalbody{padding:20px 23px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.wide{grid-column:1/-1}.field label{font-size:12px;color:#b9c7cf;font-weight:750}.field .textinput,.field .txtarea,.field .select{width:100%;min-width:0}.txtarea{resize:vertical;min-height:78px}.checkline{flex-direction:row;align-items:center;grid-column:1/-1;border:1px solid #416364;background:#1b3336;padding:12px;border-radius:9px}.checkline input{width:18px;height:18px;accent-color:var(--teal)}.checkline label{color:#d5eeec}.modalfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #354759;padding:16px 23px;gap:9px}.modalfoot .right{display:flex;gap:9px}.rowsafe{display:grid;gap:7px}.rowsafe div{padding:10px 12px;border:1px solid #2f4651;border-radius:9px;background:#162733;font-size:13px}.rowsafe small{color:var(--teal);float:right}.muted{color:var(--muted)}

/* Trainer Card designer and gallery */
.trainer-shell{display:grid;grid-template-columns:minmax(270px,.95fr) minmax(310px,1.05fr);gap:20px;align-items:start}.trainer-preview{border-radius:23px;min-height:310px;padding:26px;color:white;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card-primary,#7b48d9),var(--card-secondary,#24104c));border:1px solid #ffffff55;box-shadow:0 22px 55px #0008}.trainer-preview:after{content:'◈';position:absolute;right:-8px;top:-46px;font-size:200px;opacity:.10;pointer-events:none}.trainer-preview>*,.trainer-preview .trainer-row{position:relative;z-index:1}.trainer-eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800;opacity:.8}.trainer-avatar{display:grid;place-items:center;border-radius:18px;background:#ffffff24;border:1px solid #ffffff50;width:94px;height:94px;font-size:49px;backdrop-filter:blur(8px)}.trainer-name{font-size:clamp(25px,3vw,34px);font-weight:850;letter-spacing:-.7px;line-height:1.1;margin:9px 0 3px}.trainer-row{display:flex;align-items:center;gap:16px;margin-top:25px}.trainer-chip{border:1px solid #ffffff66;background:#ffffff25;padding:5px 9px;border-radius:99px;font-size:12px;display:inline-block;margin:7px 5px 0 0}.trainer-quote{font-style:italic;opacity:.95;overflow-wrap:anywhere;margin-top:17px}.trainer-form{padding:20px;background:var(--panel);border:1px solid var(--edge);border-radius:17px}.trainer-formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.trainer-formgrid label{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:5px}.trainer-formgrid input,.trainer-formgrid select,.trainer-formgrid textarea{background:var(--panel2);color:var(--text);border:1px solid var(--edge);border-radius:9px;padding:10px;width:100%;min-width:0}.trainer-formgrid .wide{grid-column:1/-1}.trainer-roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:18px}.trainer-roster .trainer-preview{min-height:255px;padding:19px}.trainer-roster .trainer-row{margin-top:14px}.trainer-roster .trainer-avatar{width:67px;height:67px;font-size:36px}.trainer-roster .trainer-name{font-size:24px}.trainer-title{font-size:21px;margin:0 0 12px}.trainer-helper{color:var(--muted);font-size:13px;line-height:1.6}.trainer-alert{border:1px solid var(--edge);padding:18px;border-radius:12px;background:var(--panel)}@media(max-width:870px){.trainer-shell{grid-template-columns:1fr}}
.trainer-profile-link{display:block;color:inherit;text-decoration:none;min-width:0}.trainer-profile-link:hover .trainer-preview{outline:2px solid var(--teal);outline-offset:2px;transform:translateY(-2px)}.trainer-preview{transition:transform .18s ease;isolation:isolate}

<script>

const MODE="player";

"kind":"Research","source":"Information","status":"Not started","known":"The Paleontology Institute accepts fossil specimens from the wilderness.","reward":"Research opportunities","contact":"Fieldwork notice","notes":"","sourceId":"Q-005"}],"sightings":[{"id":"K-001","pokemon":"Krabby","where":"Tideglass Mangroves","stage":"Known","behavior":"Common crab Pokémon near coastal feeding grounds","observer":"","captured":"","notes":"","sourceId":"S-002"},{"id":"K-002","pokemon":"Wimpod","where":"Near Station E-03","stage":"Known","behavior":"A Wimpod may be trapped by fishing nets","observer":"","captured":"","notes":"","sourceId":"S-003"},{"id":"K-003","pokemon":"Unknown Fire-type","where":"Old Brickworks","stage":"Rumored","behavior":"A local reported seeing an unfamiliar Fire-type","observer":"","captured":"","notes":"","sourceId":"S-004"},{"id":"K-004","pokemon":"Large clawed Pokémon","where":"Deep mangrove basin","stage":"Rumored","behavior":"Large gouges and disturbed wild Krabby have been reported","observer":"","captured":"","notes":"","sourceId":"S-005"}],"sessions":[{"session":"01","date":"","where":"Luma Town","found":"Pokédex issue and first research assignment","loose":"","decision":"","plan":""}],"home":{"main":"Research Station E-03 — a coastal monitoring station needs assistance.","optional":"A giant claw in the mangroves; strange Fire-type sightings by the brickworks.","future":"Tidebreak Master Dojo and Santara Paleontology Institute."}};
const KEY='santara-fieldwork-v1-'+MODE;
const config= MODE==='gm' ? [ ['overview','◈','Mission control'],['sites','⌖','Atlas & discoveries'],['quests','▤','Requests & arcs'],['wildlife','♧','Wildlife records'],['sessions','◷','Session log'],['publish','⇧','Publish to players'],['settings','⚙','Backup & help'] ] : [ ['overview','◈','Pokédex home'],['requests','▤','Fieldwork board'],['sites','⌖','Discovery journal'],['sightings','♧','Sightings'],['sessions','◷','Party notebook'],['trainer','★','Trainer Cards'],['settings','⚙','Sync & backup'] ];
function copy(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.sites&&Array.isArray(o.sites))return o}}catch(e){}return copy(SEED)}
let db=load(),tab=new URLSearchParams(window.location.search).get('tab')==='trainer'?'trainer':'overview',search='',filter='all',toastMsg='',edit=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toastMsg='Browser storage was unavailable. Export a JSON backup to keep your changes.';return false}}
function H(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function short(v,max=170){v=String(v??'');return v.length>max?v.slice(0,max).trim()+'…':v}
function nice(v){return String(v??'').trim()||'Not yet recorded'}
function pill(v){const s=String(v||'Unknown');const low=s.toLowerCase(),c=/hidden|secret|locked|extreme|high|failed/.test(low)?'red':/rumor|seed|concept|moderate|in progress|active/.test(low)?'gold':/known|ready|discovered|explored|resolved|complete|sighted|captured|open/.test(low)?'green':'';return `<span class="pill ${c}">${H(s)}</span>`}
function getArr(t){return db[t]||[]}
function heading(){return config.find(x=>x[0]===tab)?.[2]||'Fieldwork'}
function appHeader(){return `<aside class="sidebar"><div class="brand"><div class="mark">✦</div><div><strong>SANTARA</strong><small>FIELDWORK ${MODE==='gm'?'// GM':'// DEX'}</small></div></div><div><div class="eyebrow" style="padding:0 12px 10px">${MODE==='gm'?'PRIVATE RESEARCH CONSOLE':'TRAINER RESEARCH SYSTEM'}</div><nav class="navlinks">${config.map(x=>`<button class="navbtn ${tab===x[0]?'active':''}" data-action="nav" data-tab="${x[0]}"><span class="navico">${x[1]}</span>${x[2]}</button>`).join('')}</nav><a class="navbtn" href="./pokemon-party.html?v=mega-stone-20261027-2" style="margin-top:7px"><span class="navico">◉</span>My Pokémon</a><a class="navbtn" href="./account-access.html" style="margin-top:7px"><span class="navico">⚙</span>Account &amp; GM access</a></div><div class="sidebar-bottom"><div class="privacy"><strong>${MODE==='gm'?'⚠ KEEP THIS FILE PRIVATE':'✦ YOUR PARTY JOURNAL'}</strong>${MODE==='gm'?'Contains unrevealed locations, plot secrets and encounters. Share only the player HTML and published JSON.':'This file contains only player-safe starter knowledge. Import updates from your GM when available.'}</div></div></aside><main class="main"><header class="top"><div><div class="eyebrow">${MODE==='gm'?'SANTARA REGION / GAME MASTER':'SANTARA REGION / FIELD POKÉDEX'}</div><h1>${H(heading())}</h1><p>${MODE==='gm'?'Campaign continuity, research and player-safe publishing':'Your discoveries, requests, wildlife and party decisions in one place'}</p></div><div class="tag">${MODE==='gm'?'PRIVATE • GM ONLY':'TRAINER VIEW • NO SPOILERS'}</div></header>`}
function tile(value,label){return `<div class="stat"><div class="val">${H(value)}</div><div class="key">${H(label)}</div></div>`}
function lead(k,v){return `<div class="lead"><small>${H(k)}</small><p>${H(nice(v))}</p></div>`}
function overview(){if(MODE==='gm'){
const visible=db.sites.filter(x=>x.stage!=='Hidden').length,opened=db.quests.filter(x=>['Open','Active'].includes(x.status)).length,ready=db.sites.filter(x=>x.prep==='Ready').length;
return `<section class="hero"><div class="eyebrow">RESEARCH COMMAND / GM VIEW</div><h2>The world moves when your players do.</h2><p>Track meaningful decisions instead of every trivial action. Locations can exist without quests, and observing a Pokémon is valuable even without capturing it.</p></section><div class="stats">${tile(db.sites.length,'Sites prepared')}${tile(visible,'Locations hinted / known')}${tile(opened,'Open & active requests')}${tile(db.sessions.length,'Sessions recorded')}</div><div class="columns"><section class="panel"><div class="inlinehead"><h3>Next session briefing</h3><button class="btn small" data-action="edit" data-type="brief">Edit plan</button></div>${lead('Main lead',db.brief.main)}${lead('Optional temptations',db.brief.sides)}${lead('Complication / danger tell',db.brief.complication)}<p class="tiny">Aim for 1 main lead + 2 temptations + 1 complication. You do not have to use every prepared site.</p></section><section class="panel"><h3>Research control</h3>${lead('Ready-to-run locations',`${ready} of ${db.sites.length} sites are marked Ready`)}${lead('Open world principle','Reveal interesting clues; never require players to find an invisible quest marker.')}${lead('Session recording','Capture decisions, discoveries and consequences. Do not write a combat transcript.')}<div style="margin-top:15px"><button class="btn primary" data-action="nav" data-tab="sites">Browse locations →</button></div></section></div>`}
const discovered=db.sites.filter(x=>['Discovered','Explored','Resolved'].includes(x.stage)).length,active=db.requests.filter(x=>x.status==='In progress').length;
return `<section class="hero"><div class="eyebrow">TRAINER FIELD JOURNAL</div><h2>Your journey is yours.</h2><p>A Gym Badge is one destination, not the only one. Explore the wilderness, follow a rumor or investigate any strange Pokémon behavior that catches your interest.</p></section><div class="stats">${tile(db.requests.filter(x=>!['Completed','Abandoned'].includes(x.status)).length,'Visible requests')}${tile(active,'In progress')}${tile(discovered,'Places discovered')}${tile(db.sightings.length,'Sighting records')}</div><div class="columns"><section class="panel"><div class="inlinehead"><h3>Current leads</h3><button class="btn small" data-action="edit" data-type="home">Edit notes</button></div>${lead('Current main lead',db.home.main)}${lead('Nearby leads',db.home.optional)}${lead('Future rumors',db.home.future)}</section><section class="panel"><h3>Exploration reminders</h3><ol class="guide"><li>A rumor is not the same as a confirmed sighting.</li><li>Places can be worth exploring even without a formal request.</li><li>Dangerous areas are not necessarily scaled to your party level.</li><li>Write down theories and places you want to revisit.</li></ol><button class="btn primary" data-action="nav" data-tab="sites">Open discovery journal →</button></section></div>`}
function displayConfig(){return MODE==='gm'?{sites:['name','region','kind','stage','clue','danger'],quests:['name','region','kind','status','hook','unlock'],wildlife:['pokemon','region','habitat','stage','behavior','rarity'],sessions:['session','date','where','what','changes','next']}:{sites:['name','region','kind','stage','found','revisit'],requests:['name','region','kind','status','known','contact'],sightings:['pokemon','where','stage','behavior','observer','captured'],sessions:['session','date','where','found','loose','plan']}}
function card(o,type){const gm=MODE==='gm', title=type==='sessions'?'Session '+(o.session||'?'):(o.name||o.pokemon||o.id||'Untitled');const region=o.region||o.where||o.date||'';
const summary=type==='sites'?(gm?o.clue:o.found):type==='quests'?o.hook:type==='requests'?o.known:type==='wildlife'||type==='sightings'?o.behavior:type==='sessions'?(gm?o.what:o.found):'';
const status=o.stage||o.status||'Record',secondary=gm?(o.prep||o.danger||o.rarity||''):(o.kind||o.captured||'');
const minor=gm?(o.publish?'✓ Published / eligible':'Private / not published'):(o.notes?'Has party notes':o.id||'');
const art=(type==='wildlife'||type==='sightings')&&window.SantaraFieldworkExtra?'<div class="fw-card-art">'+window.SantaraFieldworkExtra.artMarkup(o.pokemon,o.artworkUrl,o.artworkData,o.artworkStyle)+'</div>':'';
return `<article class="entry"><div class="entry-top"><div><div class="id">${H(o.id||o.date||'SESSION')} ${region?' / '+H(region):''}</div><h3>${H(title)}</h3></div>${type==='sessions'?'<span class="pill">SESSION</span>':pill(status)}</div><div class="meta">${o.kind?pill(o.kind):''}${secondary?pill(secondary):''}</div>${art}<div class="detail">${H(short(summary||o.notes||o.gmTruth||'No observations entered yet.',215))}</div><div class="footer"><small>${H(minor)}</small><div class="fw-entry-buttons"><button class="btn small" data-fw-detail="${H(type)}" data-fw-id="${H(o.id||o.session)}">◈ Connections</button><button class="btn small" data-action="edit" data-type="${type}" data-id="${H(o.id||o.session)}">View / edit ↗</button></div></div></article>`}
function renderCollection(type){const dataset=getArr(type);const opts=['all',...new Set(dataset.map(x=>x.stage||x.status||x.region||'Other'))];if(!opts.includes(filter))filter='all';
const found=dataset.filter(x=>{const s=JSON.stringify(x).toLowerCase();return (!search||s.includes(search.toLowerCase()))&&(filter==='all'||(x.stage||x.status||x.region||'Other')===filter)});
return `<div class="controls"><input class="search" id="searchbox" placeholder="Search names, places, notes, clues…" value="${H(search)}" aria-label="Search records"><select class="select" id="filterbox" aria-label="Filter by status">${opts.map(x=>`<option value="${H(x)}" ${filter===x?'selected':''}>${x==='all'?'All statuses':H(x)}</option>`).join('')}</select><button class="btn primary" data-action="new" data-type="${type}">+ Add record</button></div><div class="collection">${found.length?found.map(o=>card(o,type)).join(''):'<div class="empty">Nothing matches your filters. Clear the search or create a new entry.</div>'}</div><div class="footerbar">${found.length} of ${dataset.length} entries • Changes save automatically in this browser</div>`}
const basicPub=['Hidden','Secret','Locked'];
function publicBundle(){const atlas=db.sites.filter(x=>x.publish&&!basicPub.includes(x.stage)).map(x=>({sourceId:x.id,id:'P-'+x.id,region:x.region,name:x.publicName||x.name,kind:x.kind,source:'GM fieldwork',stage:x.stage,found:x.clue,access:'',revisit:'',notes:''}));
const board=db.quests.filter(x=>x.publish&&!basicPub.includes(x.status)).map(x=>({sourceId:x.id,id:'F-'+x.id,name:x.name,region:x.region,kind:x.kind,source:'GM research board',status:x.status==='Active'?'In progress':x.status==='Rumored'?'Rumor':x.status==='Completed'?'Completed':'Open',known:x.hook,reward:x.reward,contact:'',notes:''}));
const sights=db.wildlife.filter(x=>x.publish&&!basicPub.includes(x.stage)).map(x=>({sourceId:x.id,id:'K-'+x.id,pokemon:x.publicName||x.pokemon,where:x.habitat,stage:x.stage,behavior:x.behavior,observer:'',captured:'',notes:''}));
return {kind:'santaraPublished',version:1,generatedAt:new Date().toISOString(),sites:atlas,requests:board,sightings:sights}}
function publishView(){const bundle=publicBundle();return `<section class="hero"><div class="eyebrow">SPOILER-SAFE PUBLISHING</div><h2>Share only what the party can know.</h2><p>Records must have <strong>Publish to players</strong> enabled and must not be Hidden, Secret or Locked. Only public clues, names and broad statuses are exported. GM truth, encounter mechanics, objectives and private notes are excluded.</p></section><div class="stats">${tile(bundle.sites.length,'Public locations')}${tile(bundle.requests.length,'Public requests')}${tile(bundle.sightings.length,'Public sightings')}${tile(db.sites.length+db.quests.length+db.wildlife.length,'Private database records')}</div><div class="columns"><section class="panel"><h3>What will be published?</h3><div class="smallcaps">Locations</div><div class="rowsafe">${bundle.sites.map(x=>`<div>${H(x.name)} <small>${H(x.stage)}</small></div>`).join('')||'<p>No locations selected</p>'}</div><div class="smallcaps" style="margin-top:15px">Requests</div><div class="rowsafe">${bundle.requests.map(x=>`<div>${H(x.name)} <small>${H(x.status)}</small></div>`).join('')||'<p>No requests selected</p>'}</div><div class="smallcaps" style="margin-top:15px">Wildlife</div><div class="rowsafe">${bundle.sightings.map(x=>`<div>${H(x.pokemon)} <small>${H(x.stage)}</small></div>`).join('')||'<p>No sightings selected</p>'}</div></section><section class="panel"><h3>Send an update</h3><ol class="guide"><li>Edit the records you want to reveal, and tick <strong>Publish to players</strong>.</li><li>Review the names and counts in the preview on the left.</li><li>Download the safe JSON update, and send it to your players.</li><li>They open their Player Pokédex and choose <strong>Import GM update</strong>.</li></ol><button class="btn primary" data-action="publish" style="margin-top:12px;width:100%">↓ Download player-safe update</button><p class="tiny" style="margin-top:16px">Never send your private GM HTML or a GM backup JSON. Public updates intentionally do not synchronize player notes back to the GM.</p></section></div>`}
function settingsView(){return `<section class="hero"><div class="eyebrow">LOCAL / OFFLINE</div><h2>Files you control, no account required.</h2><p>Everything is stored in your browser on this computer. Export backups after sessions, and keep these HTML files in a consistent folder. Opening them in a different browser may start a separate save.</p></section><div class="columns"><section class="panel"><h3>${MODE==='gm'?'Private GM backup':'Party data backup'}</h3><p>Export everything in this ${MODE==='gm'?'private console':'Pokédex'} so you can restore it on another device or recover from a cleared browser cache.</p><button class="btn primary" data-action="backup">↓ Export ${MODE==='gm'?'GM private':'player'} backup</button><div style="height:12px"></div><button class="btn" data-action="import">↑ Import ${MODE==='gm'?'GM backup':'GM update / backup'}</button><p class="tiny">${MODE==='gm'?'A GM backup contains unrevealed storyline secrets. Never share it with players.':'GM updates add or refresh published entries while preserving your own notes and progress.'}</p></section><section class="panel"><h3>Fast session routine</h3><ol class="guide">${MODE==='gm'?'<li>Before play: choose 1 main lead, 2 temptations and a complication.</li><li>During play: change site/quest statuses and jot down important choices.</li><li>After play: add a session log and update consequences.</li><li>Review publication flags, export a player-safe update.</li><li>Save a private JSON backup.</li>':'<li>During play: add your own sights, locations and research notes.</li><li>After play: update statuses and add a Party Notebook entry.</li><li>When the GM sends an update, import the JSON here.</li><li>Export a backup, especially before switching devices.</li>'}</ol></section></div><section class="panel" style="margin-top:16px"><h3>Storage and privacy</h3><p>This tracker is standalone and offline. It does not provide real-time collaboration, automatic cloud sync or accounts. A JSON file is the handoff between the private GM file and the player file.</p><button class="btn ghost warn" data-action="reset">Reset local records to starter kit</button></section>`}
function markup(){return `<div class="layout">${appHeader()}${toastMsg?`<div class="alert">${H(toastMsg)}</div>`:''}${tab==='overview'?overview():tab==='publish'?publishView():tab==='settings'?settingsView():tab==='trainer'?'<section id="trainer-card-root"></section>':renderCollection(tab)}<footer class="footerbar">SANTARA FIELDWORK • ${MODE==='gm'?'PRIVATE GM EDITION':'PLAYER POKÉDEX'} • Offline saves</footer></main></div>${edit?editor():''}`}
function render(){document.getElementById('app').innerHTML=markup();window.SantaraTrainer?.render?.();window.SantaraFieldworkExtra?.afterRender?.();}
const enums={gm:{sites:{stage:['Hidden','Rumored','Known','Discovered','Explored','Resolved'],prep:['Concept','Seeded','Ready'],danger:['Low','Moderate','High','Extreme','Variable']},quests:{status:['Secret','Locked','Rumored','Open','Active','Completed','Failed'],prep:['Concept','Seeded','Ready']},wildlife:{stage:['Hidden','Rumored','Known','Sighted','Encountered','Captured'],access:['Open','Locked']}},player:{sites:{stage:['Rumored','Known','Discovered','Explored','Resolved']},requests:{status:['Not started','Rumor','Open','In progress','Completed','Abandoned']},sightings:{stage:['Rumored','Known','Sighted','Encountered','Captured']}}};
const schemas={gm:{sites:[['id','Reference ID'],['name','Site name'],['publicName','Public display name'],['region','Region'],['kind','Location type'],['danger','Danger rating'],['access','Suggested access'],['stage','Discovery stage'],['prep','Preparation'],['clue','Player-facing clue','long'],['found','How it is found','long'],['gmTruth','GM truth / encounters','long'],['reward','Rewards / access','long'],['arc','Linked arc'],['lastSeen','Last seen / session'],['notes','Private GM notes','long'],['publish','Publish to players','check']],quests:[['id','Reference ID'],['name','Request / arc'],['region','Region'],['kind','Kind'],['unlock','Unlock / timing'],['status','State'],['hook','Public lead / clue','long'],['objective','GM-only objective','long'],['reward','Player reward'],['linked','Linked sites'],['firstShown','First shown'],['prep','Preparation'],['notes','Private GM notes','long'],['publish','Publish to players','check']],wildlife:[['id','Reference ID'],['pokemon','True Pokémon identity'],['publicName','Public display name (may be unknown!)'],['region','Region'],['habitat','Habitat'],['rarity','Rarity'],['stage','Public stage'],['access','Access'],['behavior','Player-facing observation','long'],['encounter','GM capture / encounter note','long'],['spoiler','GM spoiler','long'],['publish','Publish to players','check']],sessions:[['session','Session number'],['date','Date'],['where','Location / area'],['what','What happened','long'],['discoveries','New discoveries','long'],['moved','Requests moved','long'],['decisions','Player decisions','long'],['changes','World consequences','long'],['next','Next leads','long'],['prep','Prep notes','long']],brief:[['main','Main lead','long'],['sides','Two optional temptations','long'],['complication','Complication / danger tell','long']]},player:{sites:[['id','Journal ID'],['name','Place'],['region','Region'],['kind','Location type'],['source','How we heard'],['stage','Discovery stage'],['found','What we found','long'],['access','Items / access'],['revisit','Return later?'],['notes','Party notes','long']],requests:[['id','Board ID'],['name','Lead'],['region','Region'],['kind','Kind'],['source','Source'],['status','Status'],['known','What we know','long'],['reward','Reward / benefit'],['contact','Contact'],['notes','Party notes','long']],sightings:[['id','Journal ID'],['pokemon','Pokémon / clue'],['where','Where'],['stage','Record stage'],['behavior','Known behavior','long'],['artworkUrl','Custom artwork URL (HTTPS, optional)'],['observer','Observed by'],['captured','Captured?'],['notes','Notes','long']],sessions:[['session','Session number'],['date','Date'],['where','Where'],['found','What we discovered','long'],['loose','Loose ends / theories','long'],['decision','Party decision','long'],['plan','Next plan','long']],home:[['main','Current main lead','long'],['optional','Nearby leads','long'],['future','Future rumors','long']]}};
function editor(){const type=edit.type,original=edit.record,fields=schemas[MODE][type];const relations=window.SantaraFieldworkExtra?.relationEditor?.(type,original)||'';const uploadUI=window.SantaraFieldworkExtra?.artworkEditor?.(type,original)||'';let label=edit.isNew?'New '+type:type==='brief'||type==='home'?'Update highlights':'Edit '+type.slice(0,-1);
const form=fields.map(([k,desc,kind])=>{const value=original[k]??'',options=(enums[MODE][type]||{})[k];if(kind==='check')return `<div class="field checkline"><input id="f_${k}" type="checkbox" name="${k}" ${value?'checked':''}><label for="f_${k}">${H(desc)} — includes only public-safe fields</label></div>`;if(options)return `<div class="field"><label for="f_${k}">${H(desc)}</label><select name="${k}" id="f_${k}" class="select">${[...new Set([...options,...(value&&!options.includes(value)?[value]:[])])].map(x=>`<option value="${H(x)}" ${value===x?'selected':''}>${H(x)}</option>`).join('')}</select></div>`;if(kind==='long')return `<div class="field wide"><label for="f_${k}">${H(desc)}</label><textarea class="txtarea" id="f_${k}" name="${k}" rows="3">${H(value)}</textarea></div>`;return `<div class="field"><label for="f_${k}">${H(desc)}</label><input class="textinput" id="f_${k}" name="${k}" value="${H(value)}" ${k==='id'&&!edit.isNew?'readonly':''}></div>`}).join('');
return `<div class="modalbg" id="modalbg"><form class="modal" id="editform"><div class="modalheader"><h2>${H(label)}</h2><button class="btn ghost small" type="button" data-action="close">✕ Close</button></div><div class="modalbody">${form}${uploadUI}${relations}</div><div class="modalfoot">${!edit.isNew&&!['brief','home'].includes(type)?`<button class="btn ghost warn small" data-action="delete" type="button">Delete record</button>`:'<span class="tiny">Autosaved on Save</span>'}<div class="right"><button class="btn ghost" data-action="close" type="button">Cancel</button><button class="btn primary" type="submit">Save changes</button></div></div></form></div>`}
function findEdit(type,id){if(type==='brief'||type==='home')return {type,id:'',record:copy(db[type]),isNew:false};const item=getArr(type).find(x=>String(x.id||x.session)===String(id));if(!item)return null;return {type,id,record:copy(item),isNew:false}}
function newEdit(type){const seq=getArr(type).length+1;const prefixes={sites:MODE==='gm'?'SITE':'P',quests:'Q',wildlife:'S',requests:'F',sightings:'K'};let id=(prefixes[type]||'')+'-'+String(seq).padStart(3,'0');while(getArr(type).some(x=>x.id===id)){id+=(Math.floor(Math.random()*9)+1)}let obj=type==='sessions'?{session:String(seq).padStart(2,'0'),date:new Date().toISOString().slice(0,10)}:{id};if(MODE==='gm'&&!['sessions'].includes(type)){obj.publish=false;if(type==='sites')Object.assign(obj,{stage:'Hidden',prep:'Concept',publicName:''});if(type==='quests')Object.assign(obj,{status:'Locked',prep:'Concept'});if(type==='wildlife')Object.assign(obj,{stage:'Hidden',access:'Locked',publicName:''})}edit={type,id:null,record:obj,isNew:true}}
function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function eventClick(e){const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,type=el.dataset.type,id=el.dataset.id;if(action==='nav'){tab=el.dataset.tab;search='';filter='all';toastMsg='';edit=null;render();window.scrollTo(0,0)}if(action==='edit'){edit=findEdit(type,id);render()}if(action==='new'){newEdit(type);render()}if(action==='close'){edit=null;render()}if(action==='delete'&&edit){if(confirm('Permanently delete this record from this browser?')){db[edit.type]=db[edit.type].filter(x=>String(x.id||x.session)!==String(edit.id));edit=null;save();toastMsg='Record deleted.';render()}}if(action==='backup'){download('Santara_'+(MODE==='gm'?'PRIVATE_GM_Backup':'Player_Backup')+'.json',{kind:MODE==='gm'?'santaraGMBackup':'santaraPlayerBackup',version:1,exportedAt:new Date().toISOString(),data:db});toastMsg='Backup downloaded. Store it safely.';render()}if(action==='publish'){download('Santara_Player_Research_Update.json',publicBundle());toastMsg='Spoiler-filtered player update downloaded.';render()}if(action==='import')document.getElementById('importfile').click();if(action==='reset'){if(confirm('Replace all your locally saved records with the original starter kit? Export a backup first.')){db=copy(SEED);save();toastMsg='Starter data restored.';render()}}}
function handleSave(e){if(!(e.target instanceof HTMLFormElement) || e.target.getAttribute('id') !== 'editform')return;e.preventDefault();if(!edit)return;const form=new FormData(e.target),type=edit.type,obj=copy(edit.record);for(const [k,label,kind] of schemas[MODE][type]){obj[k]=kind==='check'?form.has(k):String(form.get(k)||'').trim()};window.SantaraFieldworkExtra?.saveRelations?.(type,obj,e.target);window.SantaraFieldworkExtra?.saveArtworkStyle?.(type,obj,e.target);if(type==='brief'||type==='home')db[type]=obj;else if(edit.isNew){if(!obj.id&&!obj.session){alert('Please add a reference ID or session number.');return}db[type].push(obj)}else{const i=db[type].findIndex(x=>String(x.id||x.session)===String(edit.id));if(i>=0)db[type][i]=obj}const wasNew=edit.isNew;edit=null;save();if(wasNew){search='';filter='all'}toastMsg=wasNew?'New entry saved in this browser. Personal notes are not shared automatically.':'Changes saved in this browser.';render()}
const ranks={Hidden:0,Rumored:1,Rumor:1,'Not started':1,Known:2,Open:2,Discovered:3,Sighted:3,'In progress':3,Encountered:4,Explored:4,Captured:5,Completed:5,Resolved:5,Abandoned:6};
function mergePublic(incoming){let added=0,updated=0;for(const type of ['sites','requests','sightings'])for(const v of (incoming[type]||[])){if(!v.sourceId)continue;const list=db[type],ix=list.findIndex(x=>x.sourceId===v.sourceId);if(ix<0){list.push(v);added++}else{const old=list[ix];let updatedObj={...old,...v};for(const k of ['notes','observer','captured','contact','revisit','access'])if(old[k])updatedObj[k]=old[k];const key=type==='requests'?'status':'stage';if((ranks[old[key]]??0)>(ranks[v[key]]??0))updatedObj[key]=old[key];updatedObj.id=old.id;list[ix]=updatedObj;updated++}}return {added,updated}}
document.addEventListener('click',eventClick);document.addEventListener('submit',handleSave);
document.addEventListener('input',e=>{if(e.target.id==='searchbox'){search=e.target.value;const at=e.target.selectionStart;render();const node=document.getElementById('searchbox');node?.focus();node?.setSelectionRange(at,at)}});
document.addEventListener('change',e=>{if(e.target.id==='filterbox'){filter=e.target.value;render()}});
document.getElementById('importfile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const imp=JSON.parse(await file.text());if(MODE==='gm'&&imp.kind==='santaraGMBackup'&&imp.data?.sites&&confirm('Replace your private GM data with this backup?')){db=imp.data;save();toastMsg='Private GM backup restored.';tab='overview'}else if(MODE==='player'&&imp.kind==='santaraPublished'){const r=mergePublic(imp);save();toastMsg=`GM update imported: ${r.added} new entries, ${r.updated} existing entries refreshed.`;tab='overview'}else if(MODE==='player'&&imp.kind==='santaraPlayerBackup'&&imp.data?.sites&&confirm('Replace your journal with this player backup?')){db=imp.data;save();toastMsg='Player backup restored.';tab='overview'}else{alert('This file is not a compatible update or backup for this edition, or import was cancelled.')}}catch(err){alert('Could not read JSON: '+err.message)}e.target.value='';render()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&edit){edit=null;render()}});
window.SantaraBridge = {
 mode:'player',
 applyPublication: bundle => {
   if(bundle?.kind !== 'santaraPublished' || !['sites','requests','sightings'].every(k=>Array.isArray(bundle[k]))) throw new Error('Invalid publication');
   // Remove only previously cloud-published records. Locally created journal entries survive.
   for(const type of ['sites','requests','sightings']) {
     const publishedIds=new Set(bundle[type].map(x=>x.sourceId));
     db[type]=db[type].filter(x=>!x.sourceId || publishedIds.has(x.sourceId));
   }
   const result=mergePublic(bundle);
   save(); render();
   return result;
 }
};
window.SantaraFieldworkBridge={
 mode:MODE,
 getDb:()=>db,
 getEditingRecord:()=>edit?.record,
 refresh:()=>render(),
 editRecord:(type,identity)=>{
   const allowed=MODE==='gm'?['sites','quests','wildlife','sessions']:['sites','requests','sightings','sessions'];
   if(!allowed.includes(type))return;
   tab=type;search='';filter='all';edit=findEdit(type,identity);render()
 }
};
render();
